<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Argentinos Juniors International Membership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --red:#E31E24; --red-deep:#B3141A; --blue:#1B4F9C; --gold:#F5B800;
  --bg:#FFFFFF; --surface:#F6F3F2; --text:#1A1416; --muted:#5E5457; --line:#E4DCDC;
  --hero:#14090B;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#150C0E;--surface:#22171A;--text:#F7F1F1;--muted:#B9AEB0;--line:#3A2B2E;--hero:#0C0506}
}
:root[data-theme="dark"]{--bg:#150C0E;--surface:#22171A;--text:#F7F1F1;--muted:#B9AEB0;--line:#3A2B2E;--hero:#0C0506}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.6}
h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",Impact,sans-serif;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.01em}
a{color:inherit}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--red);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--red);z-index:30}
.bar{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{display:flex;align-items:center;gap:12px;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:20px;text-transform:uppercase;letter-spacing:.02em;text-decoration:none}
.brand img{height:46px;width:auto;display:block}
.lang{display:flex;border:2px solid #fff;border-radius:999px;overflow:hidden}
.lang button{all:unset;cursor:pointer;padding:5px 15px;font-weight:600;font-size:15px;color:#fff}
.lang button[aria-pressed="true"]{background:#fff;color:var(--red)}
.lang button:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* hero */
.hero{background:var(--hero);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-58deg,transparent 0 120px,rgba(227,30,36,.16) 120px 124px)}
.hero .wrap{position:relative;padding-top:72px;padding-bottom:80px;display:grid;gap:34px;grid-template-columns:1.25fr .75fr;align-items:center}
.stars{color:var(--gold);letter-spacing:.35em;font-size:18px;margin-bottom:14px}
.hero h1{font-size:clamp(46px,8.4vw,104px);font-weight:800}
.hero h1 span{display:block;color:var(--red)}
.hero p{max-width:34em;color:#E9DFE0;font-size:19px;margin:22px 0 30px}
.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.04em;padding:15px 30px;border-radius:999px;border:2px solid var(--red);transition:background .15s}
.btn:hover{background:var(--red-deep);border-color:var(--red-deep)}
.btn.ghost{background:transparent;border-color:#fff;margin-left:10px}
.btn.ghost:hover{background:#fff;color:var(--red)}
.flag{justify-self:center;width:min(100%,280px);height:auto}
/* sections */
section{padding:72px 0}
section.alt{background:var(--surface)}
h2{font-size:clamp(34px,5vw,54px);font-weight:800;margin-bottom:12px}
h2::after{content:"";display:block;width:64px;height:6px;background:var(--red);margin-top:14px;border-radius:3px}
.lead{color:var(--muted);max-width:40em;margin:18px 0 38px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--bg);border:1px solid var(--line);border-left:6px solid var(--red);border-radius:6px;padding:24px}
.card:nth-child(even){border-left-color:var(--blue)}
.card h3{font-size:26px;margin-bottom:8px}
.card p{margin:0;color:var(--muted);font-size:16px}
.steps{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));counter-reset:s;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;position:relative;padding:4px 0 0 64px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:800;font-size:26px}
.steps h3{font-size:25px;margin-bottom:6px}
.steps p{margin:0;color:var(--muted);font-size:16px}
.note{border:1px solid var(--line);background:var(--bg);padding:24px;border-radius:6px;max-width:760px}
.cta{background:var(--red);color:#fff;text-align:center}
.cta h2::after{margin-left:auto;margin-right:auto;background:var(--gold)}
.cta p{max-width:34em;margin:12px auto 28px}
.cta .btn{background:#fff;color:var(--red);border-color:#fff}
.cta .btn:hover{background:var(--hero);color:#fff;border-color:var(--hero)}
footer{background:var(--hero);color:#BFB3B5;padding:30px 0 34px;font-size:14px}
@media (max-width:760px){.hero .wrap{grid-template-columns:1fr;padding-top:48px}.flag{width:150px;order:-1;justify-self:start}.btn.ghost{margin:12px 0 0}section{padding:52px 0}.brand span{display:none}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

function setLang(l){
  document.documentElement.lang=l;
  document.querySelectorAll("[data-t]").forEach(function(el){
    var k=el.getAttribute("data-t");
    if(k==="h1a"){el.firstChild.nodeValue=T[l].h1a}
    else if(k==="h1b"){el.textContent=T[l].h1b}
    else el.textContent=T[l][k];
  });
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===l)});
  try{localStorage.setItem("aja-lang",l)}catch(e){}
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.l)})});
var l="en";
try{l=localStorage.getItem("aja-lang")||""}catch(e){}
if(l!=="en"&&l!=="it"){l=((navigator.language||"en").toLowerCase().indexOf("it")===0)?"it":"en"}
setLang(l);
</script>
